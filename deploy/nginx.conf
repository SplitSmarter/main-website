server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Cloudflare talks to this origin over HTTP. A relative Location keeps the
    # visitor on https://splitsmarter.app instead of rewriting the redirect to http://.
    absolute_redirect off;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location = /api/public/notify {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8099/cgi-bin/notify;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
    }

    location = /guide {
        return 302 /guide/en/;
    }

    location = /guide/ {
        return 302 /guide/en/;
    }

    location /guide/_next/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /guide/ {
        open_file_cache off;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}

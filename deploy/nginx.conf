server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location = /guide {
        return 302 /guide/en/;
    }

    location = /guide/ {
        return 302 /guide/en/;
    }

    location /guide/ {
        open_file_cache off;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: SplitSmarter/ci-cd-workflows/.github/workflows/node-static-deploy.yml@main
    with:
      branch_name: ${{ github.ref }}
      service_name: main-website
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
